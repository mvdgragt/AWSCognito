spring:
  application:
    name: my-app

  datasource:
    # ${NEON_DATABASE_URL} reads the value from your environment at runtime.
    # You load .env into the shell with: export $(cat .env | xargs)
    url: ${NEON_DATABASE_URL}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # "update" tells Hibernate to create or alter tables based on your @Entity classes.
      # The user_profiles table will be created automatically on the first startup.
      # This is fine for development ? use Flyway migrations in a real production app.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring Security reads these two URLs on startup and fetches Cognito's public keys.
          # When a request arrives with a JWT, Spring checks its signature against those keys.
          # If valid, the request proceeds. If not, Spring returns 401 automatically.
          # You write zero token-parsing code yourself ? Spring handles all of it.
          jwk-set-uri: https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}/.well-known/jwks.json
          issuer-uri: https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}

aws:
  region: ${AWS_REGION}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID}
    client-id: ${COGNITO_CLIENT_ID}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

server:
  port: 8080